name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/was-sagst-du-dazu-0fx2vz
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veroeffentlichung gleichzeitig - aber eine laufende wird NICHT
# abgebrochen. Ein abgebrochener Pages-Deploy hinterlaesst eine haengende
# Deployment in GitHubs Warteschlange, die alle folgenden blockiert; genau
# das hat hier drei Deploys nacheinander in "deployment_queued" festgehalten,
# bis das Zeitlimit zuschlug. Neu eintreffende Laeufe warten stattdessen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Dragoncore Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Build Dragoncore Studio
        working-directory: studio
        run: npm run build

      - name: Assemble Pages site
        run: |
          # Alles wie bisher ausliefern, nur der Ordner studio/ wird durch
          # seinen fertigen Build ersetzt (Quellcode bleibt draußen).
          mkdir -p _site
          rsync -a --exclude='studio' --exclude='.github' --exclude='.git' ./ _site/
          mkdir -p _site/studio
          cp -r studio/dist/. _site/studio/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Die volle Geduld, die die Aktion zulaesst. Zehn Minuten sind ihr
          # Hoechstwert; ein groesserer Wert wird stillschweigend darauf
          # gekappt und erzeugt nur eine Warnung im Protokoll.
          timeout: 600000
