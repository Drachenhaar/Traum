<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area Paddings: iPhone Notch / Home-Indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#20261B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Dragoncore Artbook – ein handgemachtes, lebendiges Art Bible für das Fantasyprojekt Dragoncore. Build worlds. Connect everything."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dragoncore Artbook</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Notnagel gegen die stumme weiße Seite.

      Die Fehlergrenze in main.tsx hilft nur, wenn das Bündel überhaupt lädt.
      Zeigt ein zwischengespeichertes index.html dagegen auf Dateien, die es
      nach einem neuen Deploy nicht mehr gibt, läuft nie eine Zeile davon –
      und die Seite bliebe ohne diese Zeilen wortlos leer.

      Deshalb steht das hier bewusst als einfaches Skript direkt im HTML:
      ohne Modul, ohne Bündel, ohne Abhängigkeit.
    -->
    <script>
      (function () {
        var failed = [];

        /*
         * Selbstheilung bei veralteter Auslieferung.
         *
         * Kommt eine alte index.html aus dem Zwischenspeicher – des Browsers
         * oder des Auslieferungsnetzes –, zeigt sie auf Dateien, die es nicht
         * mehr gibt. Statt dem Leser eine Meldung zuzumuten, holt die Seite
         * sich einmal selbst eine frische Fassung: Die Adresse bekommt einen
         * Zeitstempel und ist damit ein anderer Eintrag im Zwischenspeicher.
         *
         * Genau einmal je Sitzung. Ohne diese Sperre entstünde eine Schleife,
         * wenn die Datei wirklich fehlt – und eine endlos neu ladende Seite
         * ist schlimmer als eine ehrliche Meldung.
         */
        var VERSUCHT = 'artbook:neu-geladen';
        function frischHolen() {
          try {
            if (sessionStorage.getItem(VERSUCHT)) return false;
            sessionStorage.setItem(VERSUCHT, '1');
          } catch (e) {
            return false; // Kein Speicher, kein Versuch – lieber die Meldung.
          }
          var url = new URL(window.location.href);
          url.searchParams.set('neu', String(Date.now()));
          window.location.replace(url.toString());
          return true;
        }

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              failed.push(el.src || el.href);
              /* Das Hauptbündel fehlt – sofort eine frische Fassung holen. */
              if (el.tagName === 'SCRIPT') frischHolen();
            }
          },
          true
        );

        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          var list = failed.length
            ? '<p style="margin:14px 0 0;font-size:12px;line-height:1.6;color:#8a7a62;word-break:break-all">' +
              'Nicht geladen:<br>' +
              failed.join('<br>') +
              '</p>'
            : '';

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:28px;box-sizing:border-box;background:#151210;' +
            'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">' +
            '<div style="max-width:30rem;text-align:center">' +
            '<p style="margin:0;font-size:19px;color:#d4af37">Dragoncore Artbook</p>' +
            '<p style="margin:12px 0 0;font-size:15px;line-height:1.65;color:#c4b48f">' +
            'Das Buch konnte nicht geöffnet werden. Meist liegt eine alte Fassung im ' +
            'Zwischenspeicher des Browsers.</p>' +
            '<p style="margin:12px 0 0;font-size:15px;line-height:1.65;color:#c4b48f">' +
            'Bitte die Seite vollständig neu laden – oder einmal ' +
            '<a href="?neu=' +
            Date.now() +
            '" style="color:#d4af37">hier tippen</a>.</p>' +
            list +
            '</div></div>';
        }, 7000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
