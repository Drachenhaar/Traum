<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area Paddings: iPhone Notch / Home-Indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#20261B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Dragoncore Artbook – ein handgemachtes, lebendiges Weltbuch für das Fantasyprojekt Dragoncore. Build worlds. Connect everything."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dragoncore Artbook</title>
  </head>
  <body>
    <!--
      Der Vorsatz – was dasteht, bevor das Buch da ist.

      Gemessen, Zeit bis zum ersten sichtbaren Zeichen: 0,14 s am Schreibtisch,
      1,7 s im WLAN, **8,0 s im Mobilfunknetz**, 11,7 s im schwachen Netz. So
      lange lag hier eine cremefarbene Fläche – nicht einmal ein Umriss –, und
      danach sprang sie ohne Übergang auf den dunklen Tisch.

      Zwei Fehler in einem: die Leere, und der Farbsprung an ihrem Ende.

      Der Vorsatz behebt beide. Er malt **sofort** denselben Tisch, auf dem
      gleich das Buch liegt; aus der Wartezeit wird damit nicht ein Ladebild,
      sondern der Ort selbst. Und weil der Grund schon der richtige ist, gibt
      es am Ende nichts mehr zu springen.

      Drei Entscheidungen, die daran hängen:

      **Die Marke erscheint erst nach 400 ms.** Wer in 140 ms geladen hat,
      soll sie nie sehen – ein Ladezeichen, das aufblitzt und sofort wieder
      geht, ist unruhiger als gar keins.

      **Kein Fortschrittsbalken, kein sich drehender Ring.** Beides zählt die
      Sekunden mit und macht das Warten länger, als es ist. Die Marke atmet
      statt zu laufen.

      **Ohne Bündel, ohne Modul, ohne Abhängigkeit.** Der Vorsatz muss
      dastehen, bevor irgendetwas geladen ist – deshalb steht er als reines
      Markup mit eigenem Stil hier und nicht in einer Komponente. Aus
      demselben Grund steht er **neben** `#root` und nicht darin: Der Notnagel
      weiter unten prüft, ob `#root` leer geblieben ist, und ein Vorsatz darin
      hätte diese Prüfung stillgelegt.
    -->
    <style>
      /* Der Grund liegt am html-Element, damit schon der allererste Anstrich
         dunkel ist – bevor das Stilblatt mit seinem Creme ankommt. */
      html {
        background-color: #100d0b;
      }
      #vorsatz {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Derselbe Tisch wie in `.desk-surface` – dieselben drei Werte. */
        background:
          radial-gradient(120% 90% at 22% 0%, rgba(212, 175, 55, 0.09) 0%, transparent 55%),
          radial-gradient(90% 70% at 80% 100%, rgba(120, 90, 50, 0.08) 0%, transparent 60%),
          linear-gradient(160deg, #1a1512 0%, #100d0b 55%, #0b0908 100%);
        transition: opacity 420ms ease;
      }
      #vorsatz[data-fort] {
        opacity: 0;
        pointer-events: none;
      }
      #vorsatz svg {
        color: #d4af37;
        opacity: 0;
        animation: vorsatz-marke 900ms ease 400ms forwards, vorsatz-atem 3.4s ease-in-out 1.3s infinite;
      }
      @keyframes vorsatz-marke {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 0.38; transform: scale(1); }
      }
      @keyframes vorsatz-atem {
        0%, 100% { opacity: 0.38; }
        50%      { opacity: 0.16; }
      }
      /* Wer Bewegung abbestellt hat, bekommt die Marke ruhig und sofort. */
      @media (prefers-reduced-motion: reduce) {
        #vorsatz svg { animation: none; opacity: 0.32; }
        #vorsatz { transition: none; }
      }
    </style>

    <div id="vorsatz" role="status" aria-label="Das Buch wird aufgeschlagen">
      <svg width="46" height="46" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
        <path
          d="M22 8c11-1 21 7 22 18 1 8-4 15-11 17 5-4 8-10 7-16-1-8-8-14-16-13-7 1-12 7-11 13 .5 5 5 8 10 7 3-.4 5-3 4.6-5.6-.3-2-2.3-3.4-4.3-3.2 4-1.6 8 1 8.5 5 .6 5-3 9.6-9 10.3-8 1-15-4.6-16-12.6-.7-6 2-11.4 6.6-14.6C6 17 2 24.6 3 33c.7 6 4.3 11.4 9.6 14"
          transform="translate(2 2) scale(.94)"
        />
        <path d="M30 2c4-2 9-1 12 2-3 0-6 1-8 3 3 2 4 5 4 8-2-3-5-5-9-5-3 0-6 2-7 4-1-4 1-8 4-10-2-1-4-1-6 0 2-2 6-3 10-2z" />
      </svg>
    </div>

    <div id="root"></div>

    <!--
      **Erst hier, nach `#root`.**

      Das Skript stand zuerst oben beim Vorsatz und fand `#root` nicht – das
      Element gab es zu diesem Zeitpunkt noch nicht. Damit meldete sich der
      Beobachter nie an, der Vorsatz blieb liegen, und weil er über allem
      liegt, verschluckte er jede Berührung: Die App war geladen, sichtbar
      war sie nicht.

      Gefunden hat es kein Zeitmesser, sondern ein Browserlauf, der etwas
      antippen wollte. Die Messungen davor prüften, ob der Grund *erscheint* –
      keine, ob er wieder *geht*.
    -->
    <script>
      /*
       * Der Vorsatz geht, sobald das Buch da ist.
       *
       * Ein Beobachter auf `#root` und kein Aufruf aus `main.tsx`: So bleibt
       * der ganze Vorgang in dieser Datei und überlebt jeden Umbau der App.
       * Bricht das Bündel, bleibt der Vorsatz stehen – und nach sieben
       * Sekunden übernimmt der Notnagel weiter unten.
       */
      (function () {
        var vorsatz = document.getElementById('vorsatz');
        var root = document.getElementById('root');
        if (!vorsatz || !root) return;

        function fort() {
          if (!vorsatz || vorsatz.hasAttribute('data-fort')) return;
          vorsatz.setAttribute('data-fort', '');
          /* Erst nach dem Ausblenden aus dem Baum nehmen. */
          window.setTimeout(function () {
            if (vorsatz && vorsatz.parentNode) vorsatz.parentNode.removeChild(vorsatz);
            vorsatz = null;
          }, 480);
        }

        if (root.childElementCount > 0) return fort();
        if (typeof MutationObserver !== 'function') {
          /* Sehr alter Browser: lieber zu früh gehen als ewig stehen. */
          window.setTimeout(fort, 2500);
          return;
        }
        var auge = new MutationObserver(function () {
          if (root.childElementCount > 0) {
            auge.disconnect();
            fort();
          }
        });
        auge.observe(root, { childList: true });
      })();
    </script>


    <!--
      Notnagel gegen die stumme weiße Seite.

      Die Fehlergrenze in main.tsx hilft nur, wenn das Bündel überhaupt lädt.
      Zeigt ein zwischengespeichertes index.html dagegen auf Dateien, die es
      nach einem neuen Deploy nicht mehr gibt, läuft nie eine Zeile davon –
      und die Seite bliebe ohne diese Zeilen wortlos leer.

      Deshalb steht das hier bewusst als einfaches Skript direkt im HTML:
      ohne Modul, ohne Bündel, ohne Abhängigkeit.
    -->
    <script>
      (function () {
        var failed = [];

        /*
         * Selbstheilung bei veralteter Auslieferung.
         *
         * Kommt eine alte index.html aus dem Zwischenspeicher – des Browsers
         * oder des Auslieferungsnetzes –, zeigt sie auf Dateien, die es nicht
         * mehr gibt. Statt dem Leser eine Meldung zuzumuten, holt die Seite
         * sich einmal selbst eine frische Fassung: Die Adresse bekommt einen
         * Zeitstempel und ist damit ein anderer Eintrag im Zwischenspeicher.
         *
         * Genau einmal je Sitzung. Ohne diese Sperre entstünde eine Schleife,
         * wenn die Datei wirklich fehlt – und eine endlos neu ladende Seite
         * ist schlimmer als eine ehrliche Meldung.
         */
        var VERSUCHT = 'artbook:neu-geladen';
        function frischHolen() {
          try {
            if (sessionStorage.getItem(VERSUCHT)) return false;
            sessionStorage.setItem(VERSUCHT, '1');
          } catch (e) {
            return false; // Kein Speicher, kein Versuch – lieber die Meldung.
          }
          var url = new URL(window.location.href);
          url.searchParams.set('neu', String(Date.now()));
          window.location.replace(url.toString());
          return true;
        }

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
              failed.push(el.src || el.href);
              /* Das Hauptbündel fehlt – sofort eine frische Fassung holen. */
              if (el.tagName === 'SCRIPT') frischHolen();
            }
          },
          true
        );

        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;

          var list = failed.length
            ? '<p style="margin:14px 0 0;font-size:12px;line-height:1.6;color:#8a7a62;word-break:break-all">' +
              'Nicht geladen:<br>' +
              failed.join('<br>') +
              '</p>'
            : '';

          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'padding:28px;box-sizing:border-box;background:#151210;' +
            'font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">' +
            '<div style="max-width:30rem;text-align:center">' +
            '<p style="margin:0;font-size:19px;color:#d4af37">Dragoncore Artbook</p>' +
            '<p style="margin:12px 0 0;font-size:15px;line-height:1.65;color:#c4b48f">' +
            'Das Buch konnte nicht geöffnet werden. Meist liegt eine alte Fassung im ' +
            'Zwischenspeicher des Browsers.</p>' +
            '<p style="margin:12px 0 0;font-size:15px;line-height:1.65;color:#c4b48f">' +
            'Bitte die Seite vollständig neu laden – oder einmal ' +
            '<a href="?neu=' +
            Date.now() +
            '" style="color:#d4af37">hier tippen</a>.</p>' +
            list +
            '</div></div>';
        }, 7000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
